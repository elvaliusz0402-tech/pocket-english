<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>口袋英语 · 地道表达本</title>
<meta name="description" content="把中文想法变成地道英文口语，拍照截图摘录台词，按场景分类，随时搜索与复习。">
<meta name="theme-color" content="#3F6577">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="口袋英语">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/favicon-64.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="appbar">
  <h1>口袋英语<span class="sub" id="appbar-sub">加载中…</span></h1>
  <button class="icon-btn" id="btn-settings" aria-label="设置">⚙️</button>
</header>

<main>
  <!-- 0. 常用100句 -->
  <section class="page active" id="page-phrases">
    <div class="card">
      <label class="field" style="margin-bottom:0">
        <span>搜索常用句（中文或英文关键词）</span>
        <input type="text" id="pb-q" placeholder="例：订位 / 退房 / 打包 / favor">
      </label>
    </div>
    <div class="chips" id="pb-cats" style="margin:2px 2px 10px"></div>
    <div class="muted" id="pb-count" style="margin:0 2px 10px"></div>
    <div id="pb-list"></div>
  </section>

  <!-- 1. 快速记录 -->
  <section class="page" id="page-capture">
    <div id="llm-banner"></div>
    <div class="card">
      <label class="field">
        <span>你想表达什么（中文）</span>
        <textarea id="cap-input" rows="3" placeholder="例：我想确认一下明天的会议时间"></textarea>
      </label>
      <div class="section-title">场景（可选，帮助选词）</div>
      <div class="chips" id="cap-scenes"></div>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn" id="cap-go" style="flex:1">生成地道说法</button>
      </div>
      <div class="muted" style="margin-top:10px">说法可以编辑，<b>确认后才收藏</b>——不让低质量内容自动进库。</div>
    </div>
    <div id="cap-results"></div>
  </section>

  <!-- 2. 图片识别 -->
  <section class="page" id="page-ocr">
    <div class="card">
      <div class="drop" id="ocr-drop">
        <div style="font-size:30px">📸</div>
        <div style="margin-top:4px">拍照或上传截图<br><span class="muted">字幕 / 台词 / vlog / 路牌 / 菜单都行</span></div>
        <div class="btn-row" style="justify-content:center;margin-top:12px">
          <button class="btn sm" id="ocr-take">拍照</button>
          <button class="btn sm ghost" id="ocr-pick">从相册选</button>
        </div>
        <div id="ocr-preview"></div>
      </div>
      <input type="file" id="ocr-file" accept="image/*" hidden>
      <div class="prog" id="ocr-prog" style="display:none"><i></i></div>
      <div class="muted" id="ocr-status" style="margin-top:8px">首次使用需联网下载识别模型（约 2MB），之后可离线。</div>
    </div>
    <div class="card" id="ocr-raw-card">
      <div class="section-title" style="margin-top:0">识别文字（可修改，也可直接粘贴字幕/台词）</div>
      <textarea id="ocr-raw" rows="5" placeholder="OCR 结果会出现在这里；不方便拍照时，直接把英文粘贴进来也行"></textarea>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn soft sm" id="ocr-split">按这段文字分句</button>
        <button class="btn ghost sm" id="ocr-clear">清空</button>
      </div>
    </div>
    <div id="ocr-sents"></div>
    <div id="ocr-cards"></div>
  </section>

  <!-- 3. 表达库 -->
  <section class="page" id="page-library">
    <div class="stats" id="lib-stats"></div>
    <div class="chips" id="lib-scenes" style="margin-top:12px"></div>
    <div class="chips" id="lib-tags" style="margin-top:8px"></div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn sm ghost" id="lib-add">+ 手动添加</button>
    </div>
    <div id="lib-list" style="margin-top:12px"></div>
  </section>

  <!-- 4. 搜索与练习 -->
  <section class="page" id="page-practice">
    <div class="card">
      <label class="field">
        <span>按中文意思搜索</span>
        <input type="text" id="p-q" placeholder="例：确认会议时间 / 拒绝邀约">
      </label>
      <div class="chips" id="p-filters"></div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn" id="p-start" style="flex:1">开始练习</button>
      </div>
      <div class="muted" id="p-count" style="margin-top:8px"></div>
    </div>
    <div id="p-list"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="phrases" class="on"><span class="ico">📖</span>常用100句</button>
  <button data-tab="capture"><span class="ico">✍️</span>快速记录</button>
  <button data-tab="ocr"><span class="ico">🖼️</span>图片识别</button>
  <button data-tab="library"><span class="ico">📚</span>表达库</button>
  <button data-tab="practice"><span class="ico">🎯</span>练习</button>
</nav>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="practice" id="practice"></div>
<div class="toast" id="toast"></div>

<script src="./data/corpus-work.js"></script>
<script src="./data/corpus-social.js"></script>
<script src="./data/corpus-life.js"></script>
<script src="./data/phrasebook.js"></script>
<script>
  window.__pwaPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__pwaPrompt = e; });
</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
